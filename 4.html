<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Document</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                text-align: center;
                margin-top: 40px;
                color: #000000
            }
            .kartu {
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                padding: 20px;
                max-width: 320px;
            }

            button {
                margin-top: 10px;
                padding: 8px 14px;
                border: none;
                border-radius: 6px;
                background: #2563eb;
                color: white;
                cursor: pointer;
            }

            button:hover {background: #1d4ed8}

            h1 {
                color: #2563eb
            }
        </style>
    </head>
    <body>
        <h1 id="judul">Hello, World!</h1>
        <p>Buka console untuk melihat pesan tambahan JavaScript.</p>
        <div class="kartu">
            <h2 id="judul kartu">Judul Awal</h2>
            <p class="deskripsi">Deskripsi awal yang akan diganti</p>
            <button id="btn-ubah">Ubah Konten</button>
        </div>

        <script>
            const btn = document.getElementById("btn-ubah");
            const judul = document.querySelector("#judul-kartu");
            const deskripsi = document.querySelector(".deskripsi");
            btn.addEventListener("click", () => {
            judul.textContent = "Judul Sudah Diubah!";
            deskripsi.textContent = "Konten ini diganti oleh JavaScript saat tombol diklik."});
        </script>
     </body>
</html>
