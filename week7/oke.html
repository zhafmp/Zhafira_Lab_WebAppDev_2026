<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="hehe.css">
    <title>TokoLab</title>
</head>
<body>

    <header>
    <div class ="container">
        <h1>TokoLab</h1>
        <p>Praktikum Web -- Digital Business Technology</p>
    </div>
    <div>
        <button class="outline">Tampilkan panduan</button>
    </div>
    </header>

    <main>
    <div class="layout">
        <div class="card">
            <div style="margin-bottom: 16px">
                <h2>KATALOG PRODUK</h2>
            </div>

        <div class="search">
            <div>
                <input type="text" placeholder="Cari nama produk">
            </div>
            <div>
                <select>
                    <option>Urutkan: Default</option>
                </select>
            </div>

        <p class="tampilkan">9 produk ditampilkan dari total 9</p>
        
        <!-- prod1 -->
        <div class="product-card">
            <span class="code">
                <img src="https://jete.id/wp-content/uploads/2026/01/Keyboard-JETE-KB101-desc-01.jpg" width="100px" height="100px">
            </span>
            <div>
                <span class="badge">Aksesoris</span>
                <h3 class="name">Keyboard Mekanik</h3>
                <p class="harga">Rp450.000</p>
                <p class="stock">Stok tersedia: 12</p>
            </div>
            <button class="btn">Tambah</button>
        </div>

        <!-- prod2 -->
         <div class="product-card">
            <span class="code">
                <img src="https://media.geeksforgeeks.org/wp-content/uploads/20250508130714821078/_Mouse-2.webp" width="100px" height="100px">
            </span>
            <div>
                <span class="badge">Aksesoris</span>
                <h3 class="name">Mouse Wireless</h3>
                <p class="harga">Rp180.000</p>
                <p class="stock">Stok tersedia: 30</p>
            </div>
            <button class="btn">Tambah</button>
        </div>
            
    </div>
    </main>
</body>
</html>
